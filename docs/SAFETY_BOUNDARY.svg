<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Identity Without Credential Custody</title><desc id="desc">Life Agent can persist safe preferences, identity hints, capability routes, and verified outcomes while excluding passwords, tokens, cookies, MFA material, payment credentials, browser profiles, and direct provider authority.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}</style></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="98" class="t title">Identity Without Credential Custody</text><text x="82" y="143" class="t sub m">Remember what helps. Return to the human for what grants authority.</text>
<rect x="82" y="215" width="680" height="505" rx="32" fill="#0D211D" stroke="#34D399" stroke-width="2"/>
<text x="125" y="280" class="t head">Safe operating context</text>
<g fill="#34D399"><circle cx="137" cy="333" r="6"/><circle cx="137" cy="383" r="6"/><circle cx="137" cy="433" r="6"/><circle cx="137" cy="483" r="6"/><circle cx="137" cy="533" r="6"/><circle cx="137" cy="583" r="6"/><circle cx="137" cy="633" r="6"/></g>
<text x="160" y="341" class="t body">Preferences + learned defaults</text><text x="160" y="391" class="t body">Safe identity metadata</text><text x="160" y="441" class="t body">Capability routes</text><text x="160" y="491" class="t body">Task-scoped AuthLease</text><text x="160" y="541" class="t body">Explicit approval boundaries</text><text x="160" y="591" class="t body">Verified provider outcomes</text><text x="160" y="641" class="t body">Content-addressed UI assets</text>
<rect x="125" y="665" width="590" height="40" rx="13" fill="#103128"/><text x="273" y="692" class="t small">Useful context, bounded authority</text>
<rect x="838" y="215" width="680" height="505" rx="32" fill="#291318" stroke="#FB7185" stroke-width="2"/>
<text x="881" y="280" class="t head">Never retained or delegated</text>
<g fill="#FB7185"><circle cx="893" cy="333" r="6"/><circle cx="893" cy="383" r="6"/><circle cx="893" cy="433" r="6"/><circle cx="893" cy="483" r="6"/><circle cx="893" cy="533" r="6"/><circle cx="893" cy="583" r="6"/><circle cx="893" cy="633" r="6"/></g>
<text x="916" y="341" class="t body">Passwords or reusable tokens</text><text x="916" y="391" class="t body">Cookies or browser profiles</text><text x="916" y="441" class="t body">MFA or recovery material</text><text x="916" y="491" class="t body">Payment credentials</text><text x="916" y="541" class="t body">Silent legal / financial approval</text><text x="916" y="591" class="t body">Arbitrary provider mutation</text><text x="916" y="641" class="t body">Authentication hidden as state</text>
<rect x="881" y="665" width="590" height="40" rx="13" fill="#39171C"/><text x="1058" y="692" class="t small">Authority stays external</text>
<rect x="365" y="770" width="870" height="92" rx="24" class="soft"/><text x="420" y="810" class="t head">Human boundary</text><text x="420" y="846" class="t small m">Consequential changes stop at the smallest decision that actually matters.</text>
</svg>