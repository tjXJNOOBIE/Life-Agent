<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Outcome First, Provider Second</title><desc id="desc">Life Agent resolves a human outcome into capabilities, routes through host-owned providers and browser tools, places explicit human approval at consequential boundaries, and verifies the provider result.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="98" class="t title">Outcome First, Provider Second</text><text x="82" y="143" class="t sub m">The goal stays stable even when the provider, app, or browser path changes.</text>
<rect x="545" y="210" width="510" height="430" rx="34" fill="#0D1A25" stroke="#5FD6F3" stroke-width="2.5"/>
<text x="590" y="270" class="t head">Life Agent Orchestrator</text>
<text x="590" y="330" class="t body m">Intent</text><text x="780" y="330" class="t body">Human outcome</text>
<text x="590" y="380" class="t body m">Route</text><text x="780" y="380" class="t body">Capability first</text>
<text x="590" y="430" class="t body m">Provider</text><text x="780" y="430" class="t body">Selected second</text>
<text x="590" y="480" class="t body m">Authority</text><text x="780" y="480" class="t body">Host + human</text>
<text x="590" y="530" class="t body m">Completion</text><text x="780" y="530" class="t body">Verified outcome</text>
<rect x="590" y="570" width="420" height="44" rx="14" class="soft"/><text x="675" y="599" class="t small">No credential custody</text>
<rect x="90" y="240" width="330" height="150" rx="28" class="card"/><text x="125" y="300" class="t head">Human request</text><text x="125" y="348" class="t body m">Outcome, not workflow</text>
<rect x="90" y="475" width="330" height="150" rx="28" class="card"/><text x="125" y="535" class="t head">Host capabilities</text><text x="125" y="583" class="t body m">Apps + browser + tools</text>
<rect x="1180" y="240" width="330" height="150" rx="28" class="card"/><text x="1215" y="300" class="t head">MCP Apps</text><text x="1215" y="348" class="t body m">Choice + commitment UI</text>
<rect x="1180" y="475" width="330" height="150" rx="28" class="card"/><text x="1215" y="535" class="t head">Connected provider</text><text x="1215" y="583" class="t body m">Owns identity + state</text>
<rect x="650" y="690" width="300" height="115" rx="28" class="card"/><text x="700" y="744" class="t head">Verify</text><text x="700" y="784" class="t small m">Read real provider state</text>
<path d="M545 330 L420 315" class="line" marker-end="url(#a)"/><path d="M545 505 L420 550" class="line" marker-end="url(#a)"/><path d="M1055 330 L1180 315" class="line" marker-end="url(#a)"/><path d="M1055 505 L1180 550" class="line" marker-end="url(#a)"/><path d="M800 640 L800 690" class="line" marker-end="url(#a)"/>
<rect x="90" y="700" width="430" height="105" rx="24" class="soft"/><text x="125" y="744" class="t head">Smallest approval</text><text x="125" y="782" class="t small m">Stop only where the human matters.</text>
<rect x="1080" y="700" width="430" height="105" rx="24" class="soft"/><text x="1115" y="744" class="t head">Replaceable providers</text><text x="1115" y="782" class="t small m">Capability remains the contract.</text>
</svg>