<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Life Agent · Development Demo</title>
  <style>
    :root{color-scheme:dark;--bg:#080b10;--panel:#111821;--panel-2:#151f2a;--line:rgba(255,255,255,.12);--text:#f4f7fb;--muted:#9baabd;--soft:#1c2936;--blue:#9dccff;--green:#9ce8bd;--amber:#f3cf91;--red:#ffaaa8;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 76% -8%,#1e3e57 0,transparent 33%),radial-gradient(circle at 4% 80%,#1b2836 0,transparent 27%),var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:rgba(7,11,16,.72);backdrop-filter:blur(26px);padding:24px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:31px;height:31px;border-radius:11px;background:linear-gradient(135deg,#c4e4ff,#6d9fc9 55%,#e7c58f);display:grid;place-items:center;color:#09121c;font-weight:900;letter-spacing:-.08em}.brand-title{font-weight:760;letter-spacing:-.025em}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.nav-label{font-size:10px;color:#718398;text-transform:uppercase;letter-spacing:.13em;padding:0 11px 7px}.nav{display:grid;gap:4px}.nav button{appearance:none;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button:hover{background:rgba(255,255,255,.055);color:var(--text)}.nav button.active{background:rgba(157,204,255,.13);color:#eaf5ff;box-shadow:inset 0 0 0 1px rgba(157,204,255,.17)}.nav-icon{width:20px;text-align:center;color:#b6c8da}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;color:var(--muted);font-size:12px}.host-pill{display:flex;align-items:center;gap:8px;margin-top:9px;color:#c7d6e4}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(156,232,189,.1)}
    .content{min-width:0;padding:28px 34px 42px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;max-width:1160px;margin:0 auto 25px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#81b8ec;font-weight:780}.topbar h1{font-size:28px;line-height:1.1;letter-spacing:-.045em;margin:7px 0 7px}.topbar p{color:var(--muted);margin:0;max-width:710px}.status-cluster{display:flex;gap:8px;align-items:center;white-space:nowrap}.status{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:999px;padding:8px 11px;color:#c8d5e2;font-size:11px}.status.live{color:var(--green);border-color:rgba(156,232,189,.3)}
    .main{max-width:1160px;margin:0 auto}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);gap:18px}.panel{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,rgba(24,36,48,.88),rgba(12,19,27,.9));box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding:19px 20px 15px;border-bottom:1px solid rgba(255,255,255,.09)}.panel-head h2{margin:0;font-size:17px;letter-spacing:-.025em}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.panel-body{padding:18px 20px}.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#8192a5;font-weight:800;margin:0 0 10px}.chat{min-height:560px;display:flex;flex-direction:column}.messages{display:flex;flex-direction:column;gap:15px;padding:22px 20px;flex:1}.message{display:flex;gap:11px;max-width:92%}.message.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;background:#28435a;color:#d9edff}.user .avatar{background:#715a37;color:#ffe4ac}.bubble{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:14px 14px 14px 4px;padding:12px 14px;color:#e8eff6}.user .bubble{border-radius:14px 14px 4px 14px;background:rgba(157,204,255,.12);border-color:rgba(157,204,255,.22)}.bubble strong{display:block;margin-bottom:4px}.bubble small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.composer{border-top:1px solid rgba(255,255,255,.09);padding:14px 16px;display:flex;gap:9px}.composer input{min-width:0;flex:1;border:1px solid var(--line);background:#0b121a;color:var(--text);border-radius:11px;padding:11px 12px;outline:none}.composer input:focus{border-color:rgba(157,204,255,.55)}.btn{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#eef6ff;border-radius:10px;padding:10px 13px;cursor:pointer}.btn:hover{background:rgba(255,255,255,.13)}.btn.primary{background:#eaf4ff;color:#101923;border-color:#eaf4ff;font-weight:750}.btn.amber{background:rgba(243,207,145,.16);border-color:rgba(243,207,145,.45);color:#ffe6b1}.btn.small{padding:7px 9px;font-size:12px}
    .rail{display:grid;gap:18px;align-content:start}.mini-card{padding:15px 16px;border:1px solid var(--line);border-radius:15px;background:rgba(11,20,29,.58)}.mini-card h3{font-size:13px;margin:0 0 7px}.mini-card p{font-size:12px;color:var(--muted);margin:0}.provider-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.provider{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 9px;color:#cdd9e5;font-size:11px}.provider-mark{width:19px;height:19px;border-radius:7px;background:#294259;display:grid;place-items:center;font-size:9px;font-weight:800;color:#d7edff}.provider.google .provider-mark{background:#385c49}.provider.gmail .provider-mark{background:#6c3d3e}.route-list{display:grid;gap:0;margin-top:12px}.route-item{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.route-item:first-child{border-top:0}.route-item .route-dot{width:12px;height:12px;margin:3px 0 0 3px;border-radius:50%;background:#28435a;border:2px solid #77b6ed}.route-item.done .route-dot{background:var(--green);border-color:var(--green)}.route-item.waiting .route-dot{background:var(--amber);border-color:var(--amber)}.route-item strong{display:block;font-size:12px}.route-item span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.metric{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px}.metric:first-child{border-top:0}.metric span{color:var(--muted)}.metric b{font-weight:700}
    .page-grid{display:grid;gap:18px}.page-grid.two{grid-template-columns:1fr 1fr}.hero-card{padding:25px;background:linear-gradient(135deg,rgba(30,61,82,.86),rgba(23,32,40,.9));border:1px solid rgba(157,204,255,.18);border-radius:19px;box-shadow:var(--shadow)}.hero-card h2{font-size:28px;line-height:1.08;letter-spacing:-.045em;margin:0;max-width:680px}.hero-card p{color:#b9c9d8;max-width:660px;margin:12px 0 0}.kicker{color:#8ec6f5;font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#bdccda;font-size:11px;background:rgba(255,255,255,.05)}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(18,28,38,.76);position:relative}.choice.recommended{border-color:rgba(157,204,255,.55);box-shadow:inset 0 0 0 1px rgba(157,204,255,.14)}.choice .rec{color:var(--green);font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:800}.choice h3{font-size:16px;margin:10px 0 5px}.choice .big{font-size:22px;font-weight:800;letter-spacing:-.035em}.choice p{color:var(--muted);font-size:12px;margin:7px 0 15px}.choice .facts{display:flex;gap:5px;flex-wrap:wrap}.choice .facts span{font-size:10px;color:#cad6e0;background:rgba(255,255,255,.07);padding:4px 6px;border-radius:6px}.choice .btn{width:100%;margin-top:16px}.selected{border:1px solid rgba(157,204,255,.35);background:rgba(32,57,75,.6);border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.selected h3{margin:0;font-size:20px}.selected p{margin:5px 0 0;color:var(--muted)}.list{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(10,18,26,.5)}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:13px 15px;border-top:1px solid rgba(255,255,255,.08)}.list-row:first-child{border-top:0}.list-row strong{font-size:13px}.list-row p{margin:3px 0 0;color:var(--muted);font-size:12px}.state{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a9baca;white-space:nowrap}.state.done{color:var(--green)}.state.waiting{color:var(--amber)}.state.blocked{color:var(--red)}.boundary{border:1px solid rgba(243,207,145,.38);background:rgba(243,207,145,.1);border-radius:15px;padding:15px}.boundary strong{display:block;color:var(--amber);margin-bottom:5px}.boundary p{color:#d2c0a1;font-size:12px;margin:0}.receipt{border:1px solid rgba(156,232,189,.35);background:linear-gradient(135deg,rgba(21,72,58,.45),rgba(14,31,31,.72));border-radius:17px;padding:20px}.receipt h2{font-size:23px;margin:7px 0}.receipt p{color:#b9d3c5;margin:0}.receipt-code{margin-top:16px;font:12px/1.5 ui-monospace,monospace;color:#bfe5ce;background:rgba(0,0,0,.2);border-radius:10px;padding:11px;white-space:pre-wrap}.preview{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#0a0d11}.preview iframe{display:block;width:100%;height:520px;border:0;background:#0b0c0e}.surface-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:13px;border-bottom:1px solid var(--line)}.surface-tabs button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#b8c8d7;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.surface-tabs button.active{color:#07111a;background:#dcedff;border-color:#dcedff;font-weight:800}.mcp-output{font:11px/1.5 ui-monospace,monospace;color:#b8c9d9;white-space:pre-wrap;max-height:240px;overflow:auto;background:#080d13;border-top:1px solid var(--line);padding:14px}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;border:1px solid rgba(156,232,189,.38);background:#102b27;color:#d8f4e4;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.muted{color:var(--muted)}.danger{color:var(--red)}
    @media(max-width:980px){.app{grid-template-columns:78px 1fr}.sidebar{padding:20px 9px}.brand{justify-content:center;padding:0}.brand-copy,.nav-label,.nav button span:not(.nav-icon),.sidebar-foot{display:none}.nav button{justify-content:center}.content{padding:24px 20px}.grid,.page-grid.two{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}@media(max-width:620px){.content{padding:18px 12px}.topbar{display:block}.status-cluster{margin-top:12px}.choices{grid-template-columns:1fr}.hero-card h2{font-size:24px}.selected{display:block}.selected .btn{margin-top:14px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">L</div><div class="brand-copy"><div class="brand-title">Life Agent</div><div class="brand-sub">personal operating system</div></div></div>
    <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
      <button data-route="overview"><span class="nav-icon">⌂</span><span>Overview</span></button>
      <button data-route="plan"><span class="nav-icon">↗</span><span>Trip plan</span></button>
      <button data-route="choices"><span class="nav-icon">◈</span><span>Choices</span></button>
      <button data-route="commitment"><span class="nav-icon">◌</span><span>Commitment</span></button>
      <button data-route="handoff"><span class="nav-icon">⇥</span><span>Handoff</span></button>
      <button data-route="execution"><span class="nav-icon">◷</span><span>Execution</span></button>
      <button data-route="outcome"><span class="nav-icon">✓</span><span>Outcome</span></button>
    </nav></div>
    <div><div class="nav-label">Product</div><nav class="nav">
      <button data-route="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <button data-route="mcp"><span class="nav-icon">⌘</span><span>MCP surfaces</span></button>
    </nav></div>
    <div class="sidebar-foot"><div>Development demo</div><div class="host-pill"><span class="dot"></span><span>Java MCP · NoAuth loopback</span></div></div>
  </aside>
  <div class="content"><header class="topbar"><div><div class="eyebrow">Life Agent · development demo</div><h1 id="page-title">Your life, in motion.</h1><p id="page-subtitle">Start with the outcome. Life Agent coordinates the next useful steps and keeps consequential decisions with you.</p></div><div class="status-cluster"><div class="status live" id="java-status">● Java MCP</div><div class="status" id="task-status">No active task</div></div></header><main class="main" id="main"></main></div>
</div>
<div class="toast" id="toast"></div>
<script>
  const state={route:(location.pathname.split('/').filter(Boolean).pop()||'overview'),taskId:'',task:null,capabilities:null,selected:null,actions:[],mcp:null,previewUri:'ui://life-agent/choices-v2.html'};
  let nextId=1,sessionId='',connected=false;
  const esc=(value)=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const text=(value,fallback='')=>value===undefined||value===null||String(value).trim()===''?fallback:String(value);
  const routeNames={overview:['Your life, in motion.','Start with the outcome. Life Agent coordinates the next useful steps and keeps consequential decisions with you.'],plan:['Trip plan','The route starts with the outcome, then maps the capabilities that can carry it forward.'],choices:['Choose the plan','A small set of trade-offs, presented before any commitment.'],commitment:['Make the smallest decision','See what your choice creates and where approval still belongs to you.'],handoff:['A quick step for you','The provider owns the account. Life Agent makes the handoff narrow and explicit.'],execution:['Live execution','Verified state, waiting state, and the next consequence in one place.'],outcome:['Outcome','A concise receipt of what became true and what remains yours to decide.'],settings:['Settings','Tune follow-through without giving away credentials or irreversible authority.'],mcp:['MCP surfaces','Inspect the NoAuth development boundary and the seven Java-owned MCP App resources.']};
  function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),3600)}
  function setRoute(route){state.route=route;history.pushState({},'',`/demo/${route}`);render()}
  function button(label,cls='btn',action=''){return `<button class="${cls}" data-action="${esc(action)}">${esc(label)}</button>`}
  function provider(name,cls=''){const initials=text(name,'Life Agent').split(/\\s+/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase();return `<div class="provider ${cls}"><span class="provider-mark">${esc(initials)}</span>${esc(name)}</div>`}
  function routeList(items){return `<div class="route-list">${items.map(x=>`<div class="route-item ${esc(x.status||'')}" ><div class="route-dot"></div><div><strong>${esc(x.label)}</strong><span>${esc(x.detail)}</span></div></div>`).join('')}</div>`}
  function list(items){return `<div class="list">${items.map(x=>`<div class="list-row"><div><strong>${esc(x.label)}</strong><p>${esc(x.detail)}</p></div><div class="state ${esc(x.status||'')}">${esc(x.state||x.status||'pending')}</div></div>`).join('')}</div>`}
  function providerRail(){return `<div class="mini-card"><h3>Connected through your host</h3><p>Life Agent discovers capabilities at runtime. Provider credentials stay behind their owning connections.</p><div class="provider-row">${provider('Google Calendar','google')}${provider('Gmail','gmail')}${provider('Browser')}</div></div>`}
  function hero(){return `<section class="hero-card"><div class="kicker">Outcome-first orchestration</div><h2>“Handle everything I need to do before my trip next week.”</h2><p>Life Agent turns one sentence into a route, a decision, a handoff, and a verified follow-through state.</p><div class="pills"><span class="pill">Calendar consequence</span><span class="pill">Email preparation</span><span class="pill">Human approval</span></div></section>`}
  function overview(){return `<div class="grid"><section class="panel chat"><div class="panel-head"><div><h2>Conversation</h2><p>The product begins where your request begins.</p></div><span class="pill">Java authority</span></div><div class="messages"><div class="message user"><div class="avatar">TJ</div><div class="bubble"><small>You</small>Handle everything I need to do before my trip next week.</div></div><div class="message"><div class="avatar">L</div><div class="bubble"><small>Life Agent</small><strong>I’ll coordinate the useful parts first.</strong>I’ll map the outcome to calendar and email capabilities, show you the meaningful choices, and stop before any consequential action.</div></div>${state.task?`<div class="message"><div class="avatar">L</div><div class="bubble"><small>Java task state</small><strong>Plan created</strong>${esc(state.task.outcome||'Trip preparation')}<br><span class="muted">Task ${esc(state.task.taskId||state.taskId)}</span></div></div>`:''}</div><div class="composer"><input id="outcome-input" value="Handle everything I need to do before my trip next week." aria-label="Outcome request">${button(state.task?'Open plan':'Run plan','btn primary',state.task?'open-plan':'run-plan')}</div></section><aside class="rail">${providerRail()}<div class="mini-card"><h3>What happens next</h3>${routeList([{label:'Resolve capabilities',detail:'Calendar + email are available through the host.',status:'done'},{label:'Show choices',detail:'Compare the smallest set of useful options.',status:state.task?'active':''},{label:'Ask before consequences',detail:'Payment and sending remain human decisions.',status:''}])}</div><div class="mini-card"><h3>Today</h3><div class="metric"><span>Task state</span><b>${esc(state.task?'active':'ready')}</b></div><div class="metric"><span>Approval policy</span><b>Ask</b></div><div class="metric"><span>Browser</span><b>Ephemeral</b></div></div></aside></div>`}
  function plan(){return `<div class="page-grid">${hero()}<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Capability route</h2><p>Life Agent resolves what the outcome needs before choosing a provider.</p></div>${button('Refresh route','btn small','refresh-plan')}</div><div class="panel-body"><div class="section-label">Observed route</div>${routeList([{label:'Interpret the outcome',detail:'Trip preparation is the task, not a flight search.',status:'done'},{label:'Calendar',detail:'Create or update a private schedule consequence.',status:'done'},{label:'Email',detail:'Prepare a draft; sending remains explicit.',status:'done'},{label:'Human',detail:'Approve booking, payment, changed terms, or important messages.',status:'waiting'}])}<div class="provider-row">${provider('Life Agent')}${provider('Google Calendar','google')}${provider('Gmail','gmail')}${provider('Human approval')}</div></div></section><aside class="rail"><div class="mini-card"><h3>Java task</h3><p>${esc(state.task?`Task ${state.task.taskId||state.taskId} is recorded by the Java state store.`:'Run the plan from Overview to create a Java-owned task.')}</p></div><div class="mini-card"><h3>Why this matters</h3><p>The route is capability-first. Providers are selected after the goal and its consequences are understood.</p></div></aside></div></div>`}
  function choices(){const options=[{title:'Alaska 421',price:'$284',detail:'10:20 → 1:09 · nonstop',facts:['Best calendar fit','Carry-on'],recommended:true},{title:'Delta 881',price:'$251',detail:'9:50 → 2:02 · one stop',facts:['Save $33','Longer connection']},{title:'United 204',price:'$319',detail:'11:05 → 1:51 · nonstop',facts:['Later','Simple fallback']}];return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>Travel options</h2><p>Three directions, compared by the afternoon you asked us to protect.</p></div><span class="pill">Choice surface</span></div><div class="panel-body"><div class="choices">${options.map((o,i)=>`<article class="choice ${o.recommended?'recommended':''}">${o.recommended?'<div class="rec">Recommended</div>':'<div class="rec">Option '+(i+1)+'</div>'}<h3>${esc(o.title)}</h3><div class="big">${esc(o.price)}</div><p>${esc(o.detail)}</p><div class="facts">${o.facts.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${button('Choose this direction',o.recommended?'btn primary':'btn','choose-'+i)}</article>`).join('')}</div><p class="muted" style="margin:16px 0 0;font-size:12px">No booking occurs here. Choosing a direction only moves the task to the commitment surface.</p></div></section><div class="grid"><aside class="mini-card"><h3>What the recommendation balances</h3>${list([{label:'Schedule',detail:'Protect the afternoon window.',status:'done',state:'best fit'},{label:'Route',detail:'Prefer nonstop.',status:'done',state:'matched'},{label:'Price',detail:'Show trade-offs before commitment.',status:'',state:'visible'}])}</aside><aside class="mini-card"><h3>Surface behavior</h3><p>Choices are read-only until you choose a direction. The next page makes consequences explicit.</p></aside></div></div>`}
  function commitment(){const chosen=state.selected||'Alaska 421 · nonstop to Seattle';return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>Commitment surface</h2><p>The chosen item is context. The consequences are the product.</p></div><span class="pill">Before action</span></div><div class="panel-body"><div class="selected"><div><div class="kicker">Selected direction</div><h3>${esc(chosen)}</h3><p>Friday · 10:20 AM · $284 · carry-on</p></div>${button('Change choice','btn small','go-choices')}</div><div class="section-label" style="margin-top:22px">What this creates</div>${list([{label:'Private calendar hold',detail:'Capture the flight window and airport buffer.',status:'',state:'Google Calendar'},{label:'Prepared email',detail:'Draft the coordination note; keep it unsent.',status:'',state:'Gmail'},{label:'Follow-through context',detail:'Keep the selected route and constraints together.',status:'',state:'Life Agent'}])}<div class="boundary" style="margin-top:18px"><strong>Approval boundary</strong><p>Payment, booking, changed terms, and important messages return to you before confirmation.</p></div><div class="mcp-actions" style="margin-top:16px">${button('Prepare safe actions','btn amber','prepare-actions')}${button('Open handoff','btn','go-handoff')}</div></div></section><aside class="rail"><div class="mini-card"><h3>Small decisions</h3><p>Seat, bag, recipient, and changed-price decisions stay visible instead of being buried in an automation loop.</p></div><div class="mini-card"><h3>Current task</h3><p>${esc(state.task?state.task.taskId||state.taskId:'No task yet. Run the plan first.')}</p></div></aside></div>`}
  function handoff(){const actionState=state.actions.length?'WAITING_FOR_HUMAN':'NOT_REQUESTED';return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>Provider handoff</h2><p>One narrow step remains with the account owner.</p></div><span class="state waiting">${actionState}</span></div><div class="panel-body"><div class="boundary"><strong>Google Calendar + Gmail</strong><p>The host owns authentication. Life Agent does not receive passwords, cookies, MFA codes, or access tokens.</p></div><div class="section-label" style="margin-top:21px">What you will review</div>${list([{label:'Calendar hold',detail:'Check the time zone and private visibility.',status:state.actions.length?'waiting':'',state:'Google Calendar'},{label:'Email draft',detail:'Review recipient and content; sending is not automatic.',status:state.actions.length?'waiting':'',state:'Gmail'},{label:'Return to Life Agent',detail:'The task resumes from the provider result.',status:'',state:'next'}])}<div class="mcp-actions" style="margin-top:17px">${button('Refresh task state','btn','refresh-task')}${button('I am done','btn primary','complete-handoff')}</div></div></section><aside class="rail">${providerRail()}<div class="mini-card"><h3>Why the stop is useful</h3><p>Waiting is a product state, not an error. You can see exactly what is ready and what still requires your authority.</p></div></aside></div>`}
  function execution(){const taskStatus=text(state.task?.status,'WAITING_FOR_HUMAN');return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>Live execution</h2><p>Java reports what is done, what is active, and what is waiting.</p></div><span class="state ${taskStatus==='WAITING_FOR_HUMAN'?'waiting':'done'}">${esc(taskStatus)}</span></div><div class="panel-body">${routeList([{label:'Plan outcome',detail:state.task?'Java task created and persisted.':'Run the plan to create a task.',status:state.task?'done':'active'},{label:'Resolve capability families',detail:'Calendar and email routes selected through the host.',status:state.task?'done':'',},{label:'Prepare provider actions',detail:state.actions.length?'Both actions are recorded at WAITING_FOR_HUMAN.':'No provider actions requested yet.',status:state.actions.length?'waiting':'',},{label:'External provider execution',detail:'Requires the human owner and connected provider surface.',status:''}])}<div class="section-label" style="margin-top:20px">Task record</div><pre class="mcp-output">${esc(state.task?JSON.stringify(state.task,null,2):'No Java task has been created yet.')}</pre></div></section><aside class="rail"><div class="mini-card"><h3>Safe by construction</h3><p>The model-facing Java tools can plan and request. Approval and execution stay outside the model view.</p></div><div class="mini-card"><h3>Next useful page</h3>${button('Open outcome','btn primary','go-outcome')}</div></aside></div>`}
  function outcome(){return `<div class="page-grid"><section class="receipt"><div class="kicker">Verified task state</div><h2>${state.actions.length?'Provider actions are ready for your review':'The plan is ready to continue'}</h2><p>${state.actions.length?'Calendar and Gmail actions were recorded by Java and remain WAITING_FOR_HUMAN. No message was sent and no payment was confirmed.':'Life Agent has a route and a decision surface. Run the plan to begin.'}</p><div class="receipt-code">${esc(state.actions.length?state.actions.map(x=>`${x.provider}: ${x.status}`).join('\\n'):'Java authority: ready\\nApproval: required\\nProvider effects: not claimed')}</div></section><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Follow-through</h2><p>Consequences stay attached to the original outcome.</p></div></div><div class="panel-body">${list([{label:'Calendar',detail:'Private test event may be created only through the connected host provider.',status:state.actions.length?'waiting':'',state:state.actions.length?'WAITING':'not requested'},{label:'Email',detail:'Draft may be prepared; sending remains a separate decision.',status:state.actions.length?'waiting':'',state:state.actions.length?'WAITING':'not requested'},{label:'Booking / payment',detail:'Always requires explicit human confirmation.',status:'waiting',state:'protected'}])}</div></section><aside class="rail"><div class="mini-card"><h3>Receipt principle</h3><p>Life Agent reports what became true, not what it intended to do.</p></div>${button('Review commitment','btn primary','go-commitment')}</aside></div></div>`}
  function settings(){return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>Life Agent settings</h2><p>Adjust follow-through while keeping authority and privacy explicit.</p></div></div><div class="panel-body"><div class="section-label">Behavior</div>${list([{label:'Handle follow-ups',detail:'Create justified calendar, reminder, or message context.',status:'done',state:'Balanced'},{label:'Avoid duplicate notifications',detail:'Prefer provider-owned reminders when they already cover the result.',status:'done',state:'On'},{label:'Browser fallback',detail:'Use a task-scoped ephemeral browser only when no connector exists.',status:'done',state:'Ephemeral'}])}<div class="section-label" style="margin-top:21px">Approvals</div>${list([{label:'Purchases',detail:'Ask before payment or changed terms.',status:'waiting',state:'Ask'},{label:'Important messages',detail:'Ask when recipient or consequence is ambiguous.',status:'waiting',state:'Ask'},{label:'Reservations',detail:'Keep final confirmation with the human owner.',status:'waiting',state:'Ask'}])}<div class="boundary" style="margin-top:18px"><strong>Privacy boundary</strong><p>Identity metadata may persist. Passwords, tokens, cookies, MFA material, and payment credentials do not.</p></div></div></section></div>`}
  function mcpPage(){const m=state.mcp;const endpoint=location.origin+'/mcp';return `<div class="page-grid"><section class="panel"><div class="panel-head"><div><h2>NoAuth demo MCP</h2><p>Loopback development transport to the Java Life Agent. No public credentials are accepted here.</p></div><span class="status live">${esc(endpoint)}</span></div><div class="panel-body"><div class="grid page-grid two"><div class="mini-card"><h3>Handshake</h3><div class="metric"><span>Transport</span><b>Streamable HTTP</b></div><div class="metric"><span>Authority</span><b>Java</b></div><div class="metric"><span>Session</span><b>${m?'Connected':'Not connected'}</b></div><div class="metric"><span>Tools</span><b>${m?.tools?.length??'—'}</b></div><div class="metric"><span>Resources</span><b>${m?.resources?.length??'—'}</b></div></div><div class="mini-card"><h3>Boundary</h3><p>Planning and read-only App resources are published here. Provider authentication, approval, payment, and browser state remain outside this NoAuth demo surface.</p>${button(m?'Refresh discovery':'Connect to Java MCP','btn primary','load-mcp')}</div></div><div class="section-label" style="margin-top:20px">MCP App resources</div><div class="surface-tabs">${(m?.resources||['choices','commitment','handoff','execution','outcome','settings','capability-route'].map(x=>({uri:'ui://life-agent/'+x+'-v2.html',name:x}))).map(x=>`<button class="${state.previewUri===x.uri?'active':''}" data-surface="${esc(x.uri)}">${esc(x.name||x.uri.split('/').pop())}</button>`).join('')}</div><div class="preview">${state.previewHtml?`<iframe title="Life Agent MCP App preview" srcdoc="${esc(state.previewHtml)}"></iframe>`:'<div class="panel-body muted">Choose a surface to read the live Java-owned MCP App resource.</div>'}</div><pre class="mcp-output">${esc(m?JSON.stringify({tools:m.tools.map(x=>x.name),resources:m.resources.map(x=>x.uri)},null,2):'')}</pre></div></section></div>`}
  function render(){const route=routeNames[state.route]?state.route:'overview';state.route=route;document.getElementById('page-title').textContent=routeNames[route][0];document.getElementById('page-subtitle').textContent=routeNames[route][1];document.getElementById('task-status').textContent=state.task?`Task ${state.task.taskId||state.taskId}`:'No active task';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));const pages={overview,plan,choices,commitment,handoff,execution,outcome,settings,mcp:mcpPage};document.getElementById('main').innerHTML=pages[route]();wire();}
  function parseTool(result){const item=result?.result?.content?.find(x=>x.type==='text');if(!item)return result?.result||result;try{return JSON.parse(item.text)}catch{return result?.result||result}}
  async function mcp(method,params={},notification=false){const body={jsonrpc:'2.0',...(notification?{}:{id:nextId++}),method,params};const headers={'accept':'application/json, text/event-stream','content-type':'application/json','mcp-protocol-version':'2025-11-25'};if(sessionId)headers['mcp-session-id']=sessionId;const response=await fetch('/mcp',{method:'POST',headers,body:JSON.stringify(body)});const returned=response.headers.get('mcp-session-id');if(returned)sessionId=returned;const value=await response.text();if(notification)return {};const lines=value.trim().split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).filter(Boolean);const parsed=lines.length?JSON.parse(lines.at(-1)):JSON.parse(value);if(parsed.error)throw new Error(parsed.error.message||'MCP request failed');return parsed}
  async function connect(){if(connected)return;document.getElementById('java-status').textContent='● Connecting';const init=await mcp('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'life-agent-demo-site',version:'0.3.0'}});await mcp('notifications/initialized',{},true);connected=true;document.getElementById('java-status').textContent='● Java MCP';return init}
  async function callTool(name,args){await connect();return parseTool(await mcp('tools/call',{name,arguments:args}))}
  async function runPlan(){const input=document.getElementById('outcome-input')?.value||'Handle everything I need to do before my trip next week.';try{const task=await callTool('life_plan',{outcome:input});state.task=task;state.taskId=task.taskId||task.id||'';state.capabilities=await callTool('life_provider_capabilities',{});toast('Java plan created and persisted');setRoute('plan')}catch(error){toast('Java MCP error: '+error.message)}}
  async function prepareActions(){if(!state.task){await runPlan();if(!state.task)return}try{const a=await callTool('life_request_action',{taskId:state.taskId,provider:'google-calendar',action:'Create a private disposable test event for trip preparation',paymentRequired:false});const b=await callTool('life_request_action',{taskId:state.taskId,provider:'gmail',action:'Prepare an unsent self-addressed test draft for trip preparation',paymentRequired:false});state.actions=[a,b];state.task=await callTool('life_task_status',{taskId:state.taskId});toast('Java recorded both actions at WAITING_FOR_HUMAN');setRoute('execution')}catch(error){toast('Java action request failed: '+error.message)}}
  async function refreshTask(){if(!state.taskId){toast('Run the plan first');return}try{state.task=await callTool('life_task_status',{taskId:state.taskId});toast('Task state refreshed from Java');render()}catch(error){toast('Task refresh failed: '+error.message)}}
  async function loadMcp(){try{await connect();const tools=(await mcp('tools/list')).result?.tools||[];const resources=(await mcp('resources/list')).result?.resources||[];state.mcp={tools,resources};toast('Live Java MCP discovery loaded');render()}catch(error){toast('MCP discovery failed: '+error.message)}}
  async function loadSurface(uri){try{await connect();const result=await mcp('resources/read',{uri});state.previewUri=uri;state.previewHtml=result.result?.contents?.[0]?.text||'';render()}catch(error){toast('Surface read failed: '+error.message)}}
  function wire(){document.querySelectorAll('[data-route]').forEach(n=>n.addEventListener('click',()=>setRoute(n.dataset.route)));document.querySelectorAll('[data-surface]').forEach(n=>n.addEventListener('click',()=>loadSurface(n.dataset.surface)));document.querySelectorAll('[data-action]').forEach(n=>n.addEventListener('click',async()=>{const a=n.dataset.action;if(a==='run-plan')return runPlan();if(a==='open-plan')return setRoute('plan');if(a==='go-choices')return setRoute('choices');if(a==='go-handoff')return setRoute('handoff');if(a==='go-outcome')return setRoute('outcome');if(a==='go-commitment')return setRoute('commitment');if(a==='prepare-actions')return prepareActions();if(a==='refresh-task')return refreshTask();if(a==='complete-handoff'){toast('Handoff remains with the human owner');return}if(a==='refresh-plan'){toast('Route is derived from Java capability policy');return}if(a.startsWith('choose-')){const labels=['Alaska 421 · nonstop to Seattle','Delta 881 · one stop to Seattle','United 204 · nonstop to Seattle'];state.selected=labels[Number(a.slice(6))]||labels[0];toast('Choice saved for the commitment surface');return setRoute('commitment')}if(a==='load-mcp')return loadMcp()}));const input=document.getElementById('outcome-input');if(input)input.addEventListener('keydown',event=>{if(event.key==='Enter')runPlan()})}
  window.addEventListener('popstate',()=>{state.route=location.pathname.split('/').filter(Boolean).pop()||'overview';render()});render();
</script>
</body>
